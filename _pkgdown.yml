url: https://yahoofinancer.rsquaredacademy.com
template:
  bootstrap: 5

authors:
  Aravind Hebbali:
    href: https://www.aravindhebbali.com

templates:
  params:
    bootswatch: cerulean
    ganalytics: UA-57270671-33

navbar:
  title: 'yahoofinancer'
  type: inverse
  left:
    - text: 'Home'
      href: index.html
    - text: 'Guides'
      menu:
        - text: 'Your First Stock Analysis'
          href: articles/first-stock-analysis.html
        - text: 'Comparing a Portfolio of Stocks'
          href: articles/comparing-portfolios.html
        - text: 'Cookbook (15 Recipes)'
          href: articles/cookbook.html
    - text: 'Reference'
      menu:
        - text: 'Functions'
          href: reference/index.html
        - text: 'News'
          href: news/index.html
  right:
    - icon: fa-github
      href: https://github.com/rsquaredacademy/yahoofinancer

articles:
  - title: 'Guides & Cookbooks'
    navbar: ~
    contents:
      - first-stock-analysis
      - comparing-portfolios
      - cookbook

home:
  links:
    - text: Our R packages
      href: https://pkgs.rsquaredacademy.com
    - text: Read our blog
      href: https://blog.rsquaredacademy.com
    - text: Our ebooks
      href: https://ebooks.rsquaredacademy.com
    - text: Online courses
      href: https://www.rsquaredacademy.com

reference:
  - title: Historical Pricing & Quotes
    desc: >
      Retrieve historical OHLCV price series and live market quotes
      via functional helpers or R6 class methods.
    contents:
      - yf_download_prices
      - yf_get_index_quotes
      - Ticker-class
      - Tickers
      - Indice-class

  - title: Fundamental & Market Data
    desc: >
      Access financial statements, valuation statistics, and real-time
      market overview snapshots.
    contents:
      - yf_get_financials
      - yf_get_market_stats
      - get_market_summary

  - title: Currency
    desc: >
      Currency listings and historical exchange rate conversion.
    contents:
      - get_currencies
      - currency_converter

  - title: Utilities
    desc: >
      Trending securities, symbol validation, and other helpers.
    contents:
      - get_trending
      - validate

  - title: Internal
    desc: Internal base class (not for end-user use).
    contents:
      - YahooFinanceBase-class
      - yahoofinancer